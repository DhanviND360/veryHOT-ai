AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM Template for veryHOT FastAPI application

Resources:
  VeryHotHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  VeryHotApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda_handler.handler
      Runtime: python3.12
      MemorySize: 512
      Timeout: 30
      Events:
        RootEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref VeryHotHttpApi
            Path: /
            Method: GET
        ProxyEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref VeryHotHttpApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: HTTP API endpoint URL
    Value: !Sub "https://${VeryHotHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  HealthEndpoint:
    Description: Health check endpoint
    Value: !Sub "https://${VeryHotHttpApi}.execute-api.${AWS::Region}.amazonaws.com/health"
